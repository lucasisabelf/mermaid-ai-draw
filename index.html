<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mermaid-draw</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <button id="btn-menu" type="button" class="menu-btn" aria-label="Diagramas" aria-controls="menu" title="Diagramas">☰</button>
        <h1><span id="diagram-name"></span><small>mermaid-draw</small></h1>
      </div>
      <div class="actions">
        <button id="btn-svg" type="button" title="Baixa o desenho do canvas como SVG">Exportar SVG</button>
        <button id="btn-png" type="button" title="Baixa o desenho do canvas como PNG">Exportar PNG</button>
        <button id="btn-copy" type="button">Copiar código</button>
        <button id="btn-clear" type="button">Limpar</button>
      </div>
    </header>
    <main class="layout">
      <aside class="palette">
        <div class="panel-title">Componentes</div>
        <div class="tool" role="button" tabindex="0" draggable="true" data-tool="rect" title="Arraste para o canvas">
          <svg viewBox="0 0 40 24" aria-hidden="true"><rect x="2" y="3" width="36" height="18" rx="6" /></svg>
          <span>Retângulo</span>
        </div>
        <div class="tool" role="button" tabindex="0" draggable="true" data-tool="arrow" title="Arraste até um retângulo ou clique para o modo seta">
          <svg viewBox="0 0 40 24" aria-hidden="true"><line x1="4" y1="12" x2="30" y2="12" /><path d="M28 6 L37 12 L28 18 Z" /></svg>
          <span>Seta</span>
        </div>
        <p class="hint" id="hint"></p>
      </aside>
      <section class="canvas" id="canvas"></section>
      <aside class="side">
        <div class="panel">
          <div class="panel-title">Código Mermaid</div>
          <textarea id="code" spellcheck="false" aria-label="Código Mermaid"></textarea>
          <div id="errors" class="errors"></div>
        </div>
        <div class="panel">
          <div class="panel-title">Preview</div>
          <div id="preview" class="preview"></div>
        </div>
      </aside>
    </main>
    <div id="menu-backdrop" class="menu-backdrop" hidden></div>
    <aside id="menu" class="menu" hidden aria-label="Diagramas">
      <div class="menu-head">
        <div class="panel-title">Diagramas</div>
        <button id="menu-close" type="button" class="icon" title="Fechar (Esc)">✕</button>
      </div>
      <input id="menu-search" class="menu-search" type="search" placeholder="Buscar diagrama…" spellcheck="false" />
      <div class="menu-tools">
        <button id="menu-new" type="button" class="primary">+ Novo</button>
        <button id="menu-import" type="button" title="Importa um .zip exportado por este menu ou um .mmd">Importar</button>
        <input id="menu-file" type="file" accept=".zip,.mmd,application/zip,text/plain" hidden />
      </div>
      <ul id="menu-list" class="menu-list"></ul>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
